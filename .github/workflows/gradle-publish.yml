name: Upload to GitHub Maven Packages

on:
  push:
    branches: [main]      # change to your default branch
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GROUP_ID: com.srcfur     # Maven groupId used in the registry
  FILE_GROUP: srclib         # the {group} part of your jar filenames
  VERSION: 1.0.0            # the {version} part of your jar filenames

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # use 17 for Minecraft 1.18-1.20.4
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - uses: gradle/actions/setup-gradle@v4

      - name: Get Environment from gradle
        run: ./gradlew -q printInfo >> $GITHUB_ENV

      - name: Build jars
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload jars to GitHub Packages
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for module in common fabric neoforge; do
            FILE="$module/build/libs/${FILE_GROUP}-${module}-${VERSION}.jar"

            if [ ! -f "$FILE" ]; then
              echo "::error::Missing file: $FILE"
              ls -la "$module/build/libs/" || true
              exit 1
            fi

            echo "Uploading $FILE"
            mvn -B deploy:deploy-file \
              -Dfile="$FILE" \
              -DgroupId="$GROUP_ID" \
              -DartifactId="${FILE_GROUP}-${module}" \
              -Dversion="$VERSION" \
              -Dpackaging=jar \
              -DgeneratePom=true \
              -DrepositoryId=github \
              -Durl="https://maven.pkg.github.com/${{ github.repository }}"
          done